<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FFF - Fast For Fight (Fix Complet)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background-color: #87CEEB; color: #fff; font-family: 'Impact', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px; z-index: 10;
        }

        .header-hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 2rem; color: #ff0055; text-transform: uppercase; font-style: italic; -webkit-text-stroke: 1px #fff; text-shadow: 2px 2px 0px #000; }
        
        .character-select {
            pointer-events: auto; background: rgba(255, 255, 255, 0.9); padding: 5px;
            border-radius: 10px; border: 2px solid #000; display: flex; gap: 5px;
        }
        .char-btn {
            background: #fff; border: 1px solid #000; padding: 4px 8px; font-weight: bold;
            cursor: pointer; border-radius: 6px; font-family: 'Impact', sans-serif; font-size: 0.85rem; text-transform: uppercase;
        }
        .char-btn.ninja { color: #ff0000; }
        .char-btn.soldier { color: #aa8800; }
        .char-btn.engineer { color: #0088ff; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* STYLES DU LAUNCHER CENTRÉ */
        .launcher-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 9, 13, 0.95); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(8px); padding: 15px;
        }
        .launcher-card {
            background: #12131c; border: 3px solid #00f0ff; border-radius: 16px;
            padding: 20px; text-align: center; max-width: 450px; width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
        }
        .launcher-title {
            font-family: 'Impact', sans-serif; font-size: 2.2rem; color: #00f0ff;
            font-style: italic; text-transform: uppercase; text-shadow: 2px 2px #ff0055;
            margin-bottom: 5px;
        }
        .launcher-subtitle { color: #a0a0b0; font-size: 0.85rem; margin-bottom: 20px; font-family: 'Segoe UI', sans-serif; }

        .char-selector-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .char-option {
            background: #1a1c29; border: 2px solid #444; border-radius: 8px;
            padding: 10px 5px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 3px;
        }
        .char-option:hover { border-color: #00f0ff; }
        .char-option.active { border-color: #ff0055; background: rgba(255, 0, 85, 0.15); box-shadow: 0 0 12px rgba(255, 0, 85, 0.4); }
        .c-title { font-family: 'Impact', sans-serif; font-size: 1rem; color: #fff; text-transform: uppercase; }
        .c-veh { font-size: 0.7rem; color: #ffe600; font-family: 'Segoe UI', sans-serif; }

        .btn-launch-game {
            background: linear-gradient(45deg, #ff0055, #ff5500); color: white; border: none;
            padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; width: 100%; text-transform: uppercase; font-family: 'Impact', sans-serif;
            letter-spacing: 1px; transition: 0.2s; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        .btn-launch-game:hover { transform: scale(1.02); }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- HUD INTERFACE JEU -->
    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF : ORIGAMI</h1>
            <div class="character-select">
                <button class="char-btn ninja" onclick="switchCharacter('ninja')">Ninja</button>
                <button class="char-btn soldier" onclick="switchCharacter('soldier')">Soldat</button>
                <button class="char-btn engineer" onclick="switchCharacter('engineer')">Ingé</button>
            </div>
        </div>
    </div>

    <!-- CONTENEUR DU CANVAS 3D -->
    <div id="game-container"></div>

    <!-- LAUNCHER PRINCIPAL -->
    <div id="home-launcher" class="launcher-overlay">
        <div class="launcher-card">
            <h1 class="launcher-title">FAST FOR FIGHT</h1>
            <p class="launcher-subtitle">Choisis ton EmojiStick</p>
            
            <div class="char-selector-grid">
                <div class="char-option active" data-class="ninja" onclick="selectClass('ninja', this)">
                    <span class="c-title">Ninja</span>
                    <span class="c-veh">Rollers</span>
                </div>
                <div class="char-option" data-class="soldier" onclick="selectClass('soldier', this)">
                    <span class="c-title">Soldat</span>
                    <span class="c-veh">VTT</span>
                </div>
                <div class="char-option" data-class="engineer" onclick="selectClass('engineer', this)">
                    <span class="c-title">Ingénieur</span>
                    <span class="c-veh">Skate</span>
                </div>
            </div>

            <button id="btn-start-game" class="btn-launch-game">Lancer la Course</button>
        </div>
    </div>

    <script>
        // --- 1. INITIALISATION DE LA SCÈNE 3D ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. SOL DE LA PISTE ---
        const roadGeo = new THREE.PlaneGeometry(30, 500);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.9, flatShading: true });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // --- 3. DÉCLARATION DU GROUPE JOUEUR ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0);

        // --- 4. CONFIGURATION DES STYLES & MATÉRIAUX ---
        const createNeonMat = (colorHex) => new THREE.MeshStandardMaterial({
            color: colorHex, roughness: 0.3, metalness: 0.1, flatShading: true
        });

        const styles = {
            ninja: { head: 0xcc0000, body: 0x111111, vehicle: 0xff0055 },
            soldier: { head: 0xffcc00, body: 0x556b2f, vehicle: 0x00f0ff },
            engineer: { head: 0x0088ff, body: 0x002b80, vehicle: 0xffe600 }
        };

        // --- 5. GÉNÉRATION 3D DU STICKMAN STYLISÉ ---
        function buildCharacter3D(className) {
            while(playerGroup.children.length > 0){ 
                playerGroup.remove(playerGroup.children[0]); 
            }

            const theme = styles[className] || styles.ninja;

            // Tête Emoji Lisse
            const headGeo = new THREE.SphereGeometry(0.9, 32, 32);
            const headMat = new THREE.MeshStandardMaterial({ color: theme.head, roughness: 0.2, metalness: 0.1 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 3.2;
            head.castShadow = true;
            playerGroup.add(head);

            // Lunettes pour l'ingénieur
            if (className === 'engineer') {
                const glassesGeo = new THREE.BoxGeometry(1.1, 0.3, 0.4);
                const glassesMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const glasses = new THREE.Mesh(glassesGeo, glassesMat);
                glasses.position.set(0, 3.2, 0.7);
                playerGroup.add(glasses);
            }

            // Corps Stickman Fin
            const bodyGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.8;
            body.castShadow = true;
            playerGroup.add(body);

            // Bras Stick
            const limbGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.4, 8);
            const limbMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            const armL = new THREE.Mesh(limbGeo, limbMat);
            armL.rotation.z = Math.PI / 4;
            armL.position.set(-0.6, 2.2, 0);
            playerGroup.add(armL);

            const armR = new THREE.Mesh(limbGeo, limbMat);
            armR.rotation.z = -Math.PI / 4;
            armR.position.set(0.6, 2.2, 0);
            playerGroup.add(armR);

            // Véhicule 3D
            const vehGroup = new THREE.Group();
            if (className === 'engineer') {
                const board = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 3.0), createNeonMat(theme.vehicle));
                board.position.y = 0.3;
                vehGroup.add(board);
            } else if (className === 'soldier') {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 2.5), createNeonMat(theme.vehicle));
                frame.position.y = 0.8;
                vehGroup.add(frame);
            } else {
                const rollerL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), createNeonMat(theme.vehicle));
                rollerL.position.set(-0.4, 0.2, 0);
                const rollerR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), createNeonMat(theme.vehicle));
                rollerR.position.set(0.4, 0.2, 0);
                vehGroup.add(rollerL, rollerR);
            }
            playerGroup.add(vehGroup);
        }

        // --- 6. GESTION DU LAUNCHER ---
        let selectedClass = 'ninja';

        function selectClass(className, element) {
            selectedClass = className;
            document.querySelectorAll('.char-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            buildCharacter3D(selectedClass);
        }

        function switchCharacter(className) {
            buildCharacter3D(className);
        }

        document.getElementById('btn-start-game').addEventListener('click', () => {
            buildCharacter3D(selectedClass);
            document.getElementById('home-launcher').classList.add('hidden');
        });

        buildCharacter3D('ninja');

        // --- 7. BOUCLE DE RENDU & CAMÉRA TPS ---
        function animate() {
            requestAnimationFrame(animate);

            // Caméra placée derrière et au-dessus pour voir parfaitement le personnage en entier
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 3.5;
            camera.position.z = playerGroup.position.z + 7;

            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
