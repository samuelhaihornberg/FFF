<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Viewport verrouillé pour empêcher le zoom et le scroll sur mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FFF : Fast For Fight - 3D Toon Parkour (Cross-Device)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; /* Empêche les gestes natifs du navigateur */ }
        body { 
            background-color: #08090d; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; z-index: 10;
        }

        .header-hud { display: flex; align-items: center; gap: 15px; }

        .logo {
            font-family: 'Impact', sans-serif; font-size: 2.2rem; color: #00f0ff;
            text-transform: uppercase; font-style: italic; text-shadow: 2px 2px 0px #ff0055;
            -webkit-text-stroke: 1px #fff;
        }

        .controls-hint {
            background: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 8px;
            border: 2px solid #ffe600; align-self: center; margin-bottom: 20px;
            font-weight: bold; color: #ffe600; font-size: 0.9rem; text-align: center;
        }

        /* 3D CANVAS CONTAINER */
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* CONTRÔLES MOBILES (Cachés par défaut sur PC) */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 20px; z-index: 20;
            pointer-events: auto; /* Active le tactile sur cette zone */
        }

        .d-pad, .action-btns {
            display: flex; gap: 10px;
        }

        .d-pad {
            display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px;
            gap: 5px;
        }

        .action-btns {
            flex-direction: column; justify-content: flex-end;
        }

        .btn-touch {
            background: rgba(0, 240, 255, 0.2); border: 2px solid #00f0ff;
            border-radius: 50%; color: #fff; font-weight: bold; font-family: 'Impact', sans-serif;
            display: flex; align-items: center; justify-content: center;
            user-select: none; font-size: 1.2rem; text-transform: uppercase;
        }
        .btn-touch:active { background: rgba(255, 0, 85, 0.6); border-color: #ff0055; transform: scale(0.95); }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .btn-action { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 230, 0, 0.2); border-color: #ffe600; }
        .btn-action:active { background: rgba(255, 230, 0, 0.6); }

        /* Afficher les contrôles tactiles uniquement sur petits écrans */
        @media (max-width: 850px) {
            #mobile-controls { display: flex; }
            .controls-hint { display: none; } /* On cache les instructions clavier sur mobile */
        }
    </style>
    <!-- Bibliothèque Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF</h1>
            <div style="background: rgba(255,0,85,0.8); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem;">
                Cross-Device 3D Toon
            </div>
        </div>
        <div class="controls-hint">
            PC : [Z/Q/S/D] Déplacement | [Espace] Saut | [Shift] Glissade
        </div>
    </div>

    <!-- UI TACTILE POUR MOBILE -->
    <div id="mobile-controls">
        <div class="d-pad">
            <div id="btn-up" class="btn-touch">▲</div>
            <div id="btn-left" class="btn-touch">◀</div>
            <div id="btn-down" class="btn-touch">▼</div>
            <div id="btn-right" class="btn-touch">▶</div>
        </div>
        <div class="action-btns">
            <div id="btn-slide" class="btn-touch btn-action" style="margin-bottom: -15px; margin-right: 40px; width: 60px; height: 60px; font-size: 0.8rem;">Slide</div>
            <div id="btn-jump" class="btn-touch btn-action">Jump</div>
        </div>
    </div>

    <div id="game-container"></div>

    <script type="text/coff" id="coff-core-config">
        <co name="physics_3d">
            <stat name="gravity" val="0.8" />
            <stat name="run_speed" val="0.4" />
            <stat name="jump_force" val="1.2" />
            <stat name="slide_boost" val="1.8" />
        </co>
    </script>

    <script>
        // --- 1. INITIALISATION DU MOTEUR 3D ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#40bcf4'); 
        scene.fog = new THREE.Fog('#40bcf4', 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // OPTIMISATION MOBILE CRUCIALE : Limiter la résolution max pour éviter la surchauffe
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. MATÉRIAUX & JOUEUR ---
        const colorPalette = {
            emojiYellow: new THREE.MeshToonMaterial({ color: 0xffcc00 }),
            suitBlue: new THREE.MeshToonMaterial({ color: 0x00f0ff }),
            wallPink: new THREE.MeshToonMaterial({ color: 0xff0055 }),
            groundDark: new THREE.MeshToonMaterial({ color: 0x1a1c29 })
        };

        const playerGroup = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), colorPalette.emojiYellow);
        head.position.y = 3; head.castShadow = true; playerGroup.add(head);

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 16), colorPalette.suitBlue);
        body.position.y = 1.5; body.castShadow = true; playerGroup.add(body);

        const skate = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 3), colorPalette.wallPink);
        skate.position.y = 0.1; skate.castShadow = true; playerGroup.add(skate);

        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0);

        // --- 3. GÉNÉRATION DU NIVEAU ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), colorPalette.groundDark);
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        const wallGeo = new THREE.BoxGeometry(4, 10, 15);
        for(let i = 0; i < 40; i++) {
            const wall = new THREE.Mesh(wallGeo, colorPalette.wallPink);
            wall.position.set((Math.random() - 0.5) * 100, 5, (Math.random() - 0.5) * 100 - 20);
            wall.rotation.y = Math.random() * Math.PI;
            wall.castShadow = true; wall.receiveShadow = true;
            scene.add(wall);
        }

        // --- 4. LOGIQUE DES CONTRÔLES (CLAVIER ET TACTILE) ---
        let velocity = { x: 0, y: 0, z: 0 };
        let isGrounded = true; let isSliding = false;
        
        // Dictionnaire des touches actives (mixe clavier et tactile)
        const keys = { up: false, down: false, left: false, right: false, jump: false, slide: false };

        // Événements Clavier
        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if(e.code === 'Space') keys.jump = true;
            if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.slide = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if(e.code === 'Space') keys.jump = false;
            if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.slide = false;
        });

        // Événements Tactiles Mobiles (mapping vers le même dictionnaire)
        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            // Empêche le comportement natif (zoom, sélection)
            const prevent = (e) => { e.preventDefault(); e.stopPropagation(); };
            btn.addEventListener('touchstart', (e) => { prevent(e); keys[keyName] = true; }, {passive: false});
            btn.addEventListener('touchend', (e) => { prevent(e); keys[keyName] = false; }, {passive: false});
            btn.addEventListener('touchcancel', (e) => { prevent(e); keys[keyName] = false; }, {passive: false});
        };

        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump');
        bindTouch('btn-slide', 'slide');

        // --- 5. BOUCLE DE RENDU 3D ---
        const cameraOffset = new THREE.Vector3(0, 7, 14);

        function animate() {
            requestAnimationFrame(animate);

            const speed = keys.slide ? 0.8 : 0.4; 
            const gravity = 0.06;

            // Application des contrôles (unifiés PC/Mobile)
            if (keys.up) velocity.z -= speed;
            if (keys.down) velocity.z += speed;
            if (keys.left) velocity.x -= speed;
            if (keys.right) velocity.x += speed;

            // Glissade
            if (keys.slide) {
                isSliding = true; head.position.y = 2; body.scale.y = 0.5;
            } else {
                isSliding = false; head.position.y = 3; body.scale.y = 1;
            }

            // Saut
            if (keys.jump && isGrounded) {
                velocity.y = 1.3; isGrounded = false;
            }

            velocity.x *= 0.82; // Friction
            velocity.z *= 0.82;
            velocity.y -= gravity;

            playerGroup.position.x += velocity.x;
            playerGroup.position.y += velocity.y;
            playerGroup.position.z += velocity.z;

            // Collision sol
            if (playerGroup.position.y < 0) {
                playerGroup.position.y = 0; velocity.y = 0; isGrounded = true;
            }

            // Animations d'inclinaison
            playerGroup.rotation.z = -velocity.x * 0.2;
            playerGroup.rotation.x = velocity.z * 0.2;

            // Caméra TPS dynamique
            const targetCamPos = playerGroup.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(playerGroup.position);

            renderer.render(scene, camera);
        }

        // Responsive complet
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
