<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FFF : 3D Origami Parkour</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background-color: #87CEEB; color: #fff; font-family: 'Impact', sans-serif; overflow: hidden; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; z-index: 10;
        }

        .header-hud { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 2.5rem; color: #ff0055; text-transform: uppercase; font-style: italic; -webkit-text-stroke: 1.5px #fff; text-shadow: 3px 3px 0px #000; }
        
        /* Panneau de sélection inspiré de l'image */
        .character-select {
            pointer-events: auto; background: rgba(255, 255, 255, 0.9); padding: 10px;
            border-radius: 12px; border: 3px solid #000; display: flex; gap: 10px;
        }
        .char-btn {
            background: #fff; border: 2px solid #000; padding: 5px 10px; font-weight: bold;
            cursor: pointer; border-radius: 8px; font-family: 'Impact', sans-serif; font-size: 1rem; text-transform: uppercase;
        }
        .char-btn.ninja { color: #ff0000; }
        .char-btn.soldier { color: #aa8800; }
        .char-btn.engineer { color: #0088ff; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 20px; z-index: 20; pointer-events: auto;
        }
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; }
        .btn-touch {
            background: rgba(255,255,255,0.2); border: 2px solid #000; border-radius: 10px;
            color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
        }
        #btn-up { grid-column: 2; grid-row: 1; } #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; } #btn-right { grid-column: 3; grid-row: 2; }
        .action-btns { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
        .btn-action { width: 70px; height: 70px; border-radius: 50%; background: #ff0055; color: #fff; border: 3px solid #000; }

        @media (max-width: 850px) { #mobile-controls { display: flex; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF : ORIGAMI</h1>
            <div class="character-select">
                <button class="char-btn ninja" onclick="switchCharacter('ninja')">Ninja (Rollers)</button>
                <button class="char-btn soldier" onclick="switchCharacter('soldier')">Soldat (VTT)</button>
                <button class="char-btn engineer" onclick="switchCharacter('engineer')">Ingé (Skate)</button>
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div id="btn-up" class="btn-touch">▲</div>
            <div id="btn-left" class="btn-touch">◀</div>
            <div id="btn-down" class="btn-touch">▼</div>
            <div id="btn-right" class="btn-touch">▶</div>
        </div>
        <div class="action-btns">
            <div id="btn-slide" class="btn-touch btn-action" style="width: 50px; height: 50px; font-size: 0.8rem;">SLIDE</div>
            <div id="btn-jump" class="btn-touch btn-action" style="font-size: 1rem;">JUMP</div>
        </div>
    </div>

    <div id="game-container"></div>

    <script>
        // --- 1. INITIALISATION 3D ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); // Ciel bleu clair de l'image
        scene.fog = new THREE.Fog('#87CEEB', 30, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lumières fortes pour marquer les plis du papier
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 100, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. MATÉRIAUX ORIGAMI PAPIER ---
        // Le secret : flatShading = true pour voir les polygones (plis), roughness = 1 (papier mat)
        const paperMat = (colorHex) => new THREE.MeshStandardMaterial({ 
            color: colorHex, roughness: 1, metalness: 0, flatShading: true 
        });

        const colors = {
            red: paperMat(0xff2222), yellow: paperMat(0xffcc00), blue: paperMat(0x0088ff),
            black: paperMat(0x222222), grey: paperMat(0x888888), white: paperMat(0xffffff),
            road: paperMat(0x333333), wood: paperMat(0x8B5A2B)
        };

        // --- 3. GÉNÉRATEUR DE PERSONNAGES ORIGAMI ---
        let playerGroup = new THREE.Group();
        scene.add(playerGroup);

        function buildCharacter(type) {
            // Nettoyer l'ancien personnage
            while(playerGroup.children.length > 0){ 
                playerGroup.remove(playerGroup.children[0]); 
            }

            // Tête : Icosaèdre (aspect papier plié arrondi)
            const headGeo = new THREE.IcosahedronGeometry(1.2, 1); 
            // Corps : Cylindre à 6 faces (aspect hexagone de papier)
            const bodyGeo = new THREE.CylinderGeometry(0.8, 0.6, 2.5, 6);

            let head, body, vehicle;

            if (type === 'ninja') {
                // Ninja Rouge sur Rollers
                head = new THREE.Mesh(headGeo, colors.red);
                body = new THREE.Mesh(bodyGeo, colors.black);
                
                // Rollers
                vehicle = new THREE.Group();
                const bootGeo = new THREE.BoxGeometry(0.6, 0.8, 1.2);
                const bootL = new THREE.Mesh(bootGeo, colors.black); bootL.position.set(-0.5, 0.4, 0);
                const bootR = new THREE.Mesh(bootGeo, colors.black); bootR.position.set(0.5, 0.4, 0);
                vehicle.add(bootL, bootR);
            } 
            else if (type === 'soldier') {
                // Soldat Jaune sur VTT
                head = new THREE.Mesh(headGeo, colors.yellow);
                body = new THREE.Mesh(bodyGeo, colors.wood); // Simulation Camo
                
                // VTT Origami (assemblage de tubes plats)
                vehicle = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 3), colors.black);
                frame.position.y = 1;
                const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 8); // Roues octogonales
                const wheelF = new THREE.Mesh(wheelGeo, colors.black); wheelF.rotation.z = Math.PI/2; wheelF.position.set(0, 0.8, 1.5);
                const wheelB = new THREE.Mesh(wheelGeo, colors.black); wheelB.rotation.z = Math.PI/2; wheelB.position.set(0, 0.8, -1.5);
                vehicle.add(frame, wheelF, wheelB);
            } 
            else if (type === 'engineer') {
                // Ingénieur Bleu sur Skate
                head = new THREE.Mesh(headGeo, colors.blue);
                body = new THREE.Mesh(bodyGeo, colors.blue);
                
                // Skate Board Origami
                vehicle = new THREE.Group();
                const board = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 3.5), colors.blue);
                board.position.y = 0.3;
                vehicle.add(board);
            }

            head.position.y = 4; head.castShadow = true;
            body.position.y = 2; body.castShadow = true;
            
            playerGroup.add(head);
            playerGroup.add(body);
            playerGroup.add(vehicle);
        }

        // --- 4. DÉCOR : PISTE ET LIGNE D'ARRIVÉE ---
        // Route (Bande de papier gris foncé)
        const road = new THREE.Mesh(new THREE.PlaneGeometry(30, 1000), colors.road);
        road.rotation.x = -Math.PI / 2; road.receiveShadow = true;
        scene.add(road);

        // Ligne d'arrivée (Portique style carton)
        const archGroup = new THREE.Group();
        const pillarGeo = new THREE.BoxGeometry(2, 15, 2);
        const pillarL = new THREE.Mesh(pillarGeo, colors.grey); pillarL.position.set(-12, 7.5, -40); pillarL.castShadow = true;
        const pillarR = new THREE.Mesh(pillarGeo, colors.grey); pillarR.position.set(12, 7.5, -40); pillarR.castShadow = true;
        const topBanner = new THREE.Mesh(new THREE.BoxGeometry(26, 3, 2), colors.red); topBanner.position.set(0, 16, -40); topBanner.castShadow = true;
        archGroup.add(pillarL, pillarR, topBanner);
        scene.add(archGroup);

        // --- 5. PHYSIQUE ET BOUCLE DE JEU ---
        window.switchCharacter = function(type) { buildCharacter(type); };
        buildCharacter('ninja'); // Perso par défaut

        let velocity = { x: 0, y: 0, z: 0 };
        let isGrounded = true;
        const keys = { up: false, down: false, left: false, right: false, jump: false, slide: false };

        // Inputs (simplifiés pour l'exemple)
        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if(e.code === 'Space') keys.jump = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if(e.code === 'Space') keys.jump = false;
        });

        const cameraOffset = new THREE.Vector3(0, 8, 18);

        function animate() {
            requestAnimationFrame(animate);

            // Physique basique
            if (keys.up) velocity.z -= 0.5;
            if (keys.left) velocity.x -= 0.5;
            if (keys.right) velocity.x += 0.5;
            if (keys.jump && isGrounded) { velocity.y = 1.2; isGrounded = false; }

            velocity.x *= 0.85; velocity.z *= 0.85; velocity.y -= 0.08;
            playerGroup.position.add(velocity);

            if (playerGroup.position.y < 0) { playerGroup.position.y = 0; velocity.y = 0; isGrounded = true; }
            
            // Limites de la route
            if (playerGroup.position.x > 14) playerGroup.position.x = 14;
            if (playerGroup.position.x < -14) playerGroup.position.x = -14;

            playerGroup.rotation.z = -velocity.x * 0.1;
            playerGroup.rotation.y = -velocity.x * 0.1;

            // Caméra qui suit le joueur
            const targetCamPos = playerGroup.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(playerGroup.position);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
