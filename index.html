<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFF : Fast For Fight - 3D Toon Parkour</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #08090d; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; /* Empêche le scroll, le jeu prend tout l'écran */
        }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .header-hud {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: 'Impact', sans-serif;
            font-size: 2.5rem;
            color: #00f0ff;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 2px 2px 0px #ff0055;
            -webkit-text-stroke: 1px #fff;
        }

        .controls-hint {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #ffe600;
            align-self: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ffe600;
        }

        /* 3D CANVAS CONTAINER */
        #game-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
    </style>
    <!-- Chargement de la bibliothèque 3D Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF</h1>
            <div style="background: rgba(255,0,85,0.8); padding: 5px 15px; border-radius: 20px; font-weight: bold;">
                Moteur 3D Toon - Build 0.1
            </div>
        </div>
        <div class="controls-hint">
            [Z/Q/S/D] Déplacement | [Espace] Saut | [Shift] Glissade Vitesse
        </div>
    </div>

    <div id="game-container"></div>

    <!-- CONFIGURATION COFF POUR LA LOGIQUE (Adaptée à la 3D) -->
    <script type="text/coff" id="coff-core-config">
        <co name="physics_3d">
            <stat name="gravity" val="0.8" />
            <stat name="run_speed" val="0.4" />
            <stat name="jump_force" val="1.2" />
            <stat name="slide_boost" val="1.8" />
        </co>
    </script>

    <script>
        // --- 1. INITIALISATION DU MOTEUR 3D ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        // Ciel couleur bleu "Disney"
        scene.background = new THREE.Color('#40bcf4'); 
        scene.fog = new THREE.Fog('#40bcf4', 20, 100); // Effet de profondeur atmosphérique

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Activer les ombres
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. LUMIÈRES (Indispensable pour le Toon Shading) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        scene.add(dirLight);

        // --- 3. MATÉRIAUX TOON (Style Dessin Animé) ---
        // Le MeshToonMaterial donne cet aspect aplat de couleur
        const colorPalette = {
            emojiYellow: new THREE.MeshToonMaterial({ color: 0xffcc00 }),
            suitBlue: new THREE.MeshToonMaterial({ color: 0x00f0ff }),
            wallPink: new THREE.MeshToonMaterial({ color: 0xff0055 }),
            groundDark: new THREE.MeshToonMaterial({ color: 0x1a1c29 })
        };

        // --- 4. CRÉATION DU JOUEUR (EmojiStick 3D) ---
        const playerGroup = new THREE.Group();
        
        // Tête Emoji
        const headGeo = new THREE.SphereGeometry(1, 32, 32);
        const head = new THREE.Mesh(headGeo, colorPalette.emojiYellow);
        head.position.y = 3;
        head.castShadow = true;
        playerGroup.add(head);

        // Corps Stick
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
        const body = new THREE.Mesh(bodyGeo, colorPalette.suitBlue);
        body.position.y = 1.5;
        body.castShadow = true;
        playerGroup.add(body);

        // "Skate" ou socle sous les pieds
        const skateGeo = new THREE.BoxGeometry(1.5, 0.2, 3);
        const skate = new THREE.Mesh(skateGeo, colorPalette.wallPink);
        skate.position.y = 0.1;
        skate.castShadow = true;
        playerGroup.add(skate);

        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0);

        // --- 5. CRÉATION DU LABYRINTHE (Niveau 3D) ---
        // Sol
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const ground = new THREE.Mesh(groundGeo, colorPalette.groundDark);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Murs du labyrinthe générés aléatoirement
        const walls = [];
        const wallGeo = new THREE.BoxGeometry(4, 10, 15);
        for(let i = 0; i < 40; i++) {
            const wall = new THREE.Mesh(wallGeo, colorPalette.wallPink);
            wall.position.x = (Math.random() - 0.5) * 100;
            wall.position.z = (Math.random() - 0.5) * 100 - 20; // Pousser les murs vers l'avant
            wall.position.y = 5;
            wall.rotation.y = Math.random() * Math.PI;
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        // --- 6. LOGIQUE PHYSIQUE ET CONTRÔLES ---
        let velocity = { x: 0, y: 0, z: 0 };
        let isGrounded = true;
        let isSliding = false;

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Positionnement de la caméra (TPS)
        const cameraOffset = new THREE.Vector3(0, 6, 12);

        function animate() {
            requestAnimationFrame(animate);

            // Simulation du COFF Parser pour les stats (simplifié)
            const speed = isSliding ? 0.8 : 0.4; 
            const gravity = 0.05;

            // Contrôles directionnels
            if (keys['KeyW'] || keys['ArrowUp']) velocity.z -= speed;
            if (keys['KeyS'] || keys['ArrowDown']) velocity.z += speed;
            if (keys['KeyA'] || keys['ArrowLeft']) velocity.x -= speed;
            if (keys['KeyD'] || keys['ArrowRight']) velocity.x += speed;

            // Glissade (Shift)
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                isSliding = true;
                head.position.y = 2; // Le personnage se baisse
                body.scale.y = 0.5;
            } else {
                isSliding = false;
                head.position.y = 3;
                body.scale.y = 1;
            }

            // Saut
            if (keys['Space'] && isGrounded) {
                velocity.y = 1.2;
                isGrounded = false;
            }

            // Appliquer la vélocité et la friction
            velocity.x *= 0.8;
            velocity.z *= 0.8;
            
            // Gravité
            velocity.y -= gravity;

            playerGroup.position.x += velocity.x;
            playerGroup.position.y += velocity.y;
            playerGroup.position.z += velocity.z;

            // Collision avec le sol
            if (playerGroup.position.y < 0) {
                playerGroup.position.y = 0;
                velocity.y = 0;
                isGrounded = true;
            }

            // Inclinaison du personnage en fonction de la vitesse (Feedback visuel)
            playerGroup.rotation.z = -velocity.x * 0.2;
            playerGroup.rotation.x = velocity.z * 0.2;

            // La caméra suit le joueur de manière fluide (Lerp)
            const targetCamPos = playerGroup.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(playerGroup.position);

            renderer.render(scene, camera);
        }

        // Gestion du redimensionnement de l'écran
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Lancer la boucle de jeu
        animate();
    </script>
</body>
</html>
