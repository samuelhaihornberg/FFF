<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFF : Fight for Fast - Parkour, Wheels & Combat</title>
    <meta name="description" content="FFF : Fight for Fast - Le jeu ultime de course parkour en Skateboard, VTT et Rollers avec du combat survolté !">
    <link rel="manifest" href="data:application/manifest+json,{
        %22name%22:%22Fight%20for%20Fast%22,
        %22short_name%22:%22FFF%22,
        %22start_url%22:%22.%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22#08090d%22,
        %22theme_color%22:%22#ff0055%22
    }">
    
    <style id="fff-main-styles">
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.fff-app {
            background-color: #08090d;
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER & LOGO EN-TÊTE */
        .fff-header {
            width: 100%;
            padding: 15px 10px;
            background: linear-gradient(180deg, rgba(255, 0, 85, 0.15) 0%, rgba(8, 9, 13, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #00f0ff;
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.2);
        }

        .logo-container {
            position: relative;
            width: 320px;
            height: 140px;
            margin-bottom: 5px;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 0px 12px #ff0055);
        }

        .fff-title {
            font-size: 2.8rem;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #ff0055, -3px -3px 0px #00f0ff, 0 0 15px #ffe600;
            font-style: italic;
            transform: skewX(-5deg);
        }

        .fff-slogan {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: #ffe600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #ffe600;
        }

        /* LAUNCHER PWA OVERLAY */
        #home-launcher {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 9, 13, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .launcher-card {
            background: #12131c;
            border: 3px solid #00f0ff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.3);
            max-width: 450px;
            width: 90%;
        }

        .btn-action {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Impact', sans-serif;
        }

        .btn-action:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }

        .btn-pwa {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
        }

        /* ZONE DE JEU (CANVAS) */
        #game-viewport {
            position: relative;
            margin-top: 15px;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #12131c;
        }

        .controls-hint {
            margin-top: 10px;
            color: #00f0ff;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            text-align: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="fff-app">

    <!-- HEADER OFFICIEL AVEC LOGO TUNÉ ET SLOGAN -->
    <header class="fff-header">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="neon-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff0055" />
                        <stop offset="100%" stop-color="#ffe600" />
                    </linearGradient>
                    <linearGradient id="neon-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#7000ff" />
                    </linearGradient>
                </defs>

                <!-- SKATEBOARD TUNÉ -->
                <g transform="translate(40, 110) rotate(-12)">
                    <rect x="0" y="0" width="300" height="22" rx="11" fill="url(#neon-grad1)" stroke="#000" stroke-width="3"/>
                    <rect x="15" y="3" width="270" height="4" fill="#111"/>
                    <circle cx="45" cy="28" r="12" fill="#00f0ff" stroke="#000" stroke-width="3"/>
                    <circle cx="255" cy="28" r="12" fill="#00f0ff" stroke="#000" stroke-width="3"/>
                    <path d="M -20 11 Q -5 0 10 11 Q -5 22 -20 11 Z" fill="#ffe600"/>
                </g>

                <!-- ROUE VTT TUNÉE -->
                <g transform="translate(70, 75)">
                    <circle cx="0" cy="0" r="38" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-dasharray="6,4"/>
                    <circle cx="0" cy="0" r="32" fill="none" stroke="#ff0055" stroke-width="4"/>
                    <line x1="-28" y1="0" x2="28" y2="0" stroke="#00f0ff" stroke-width="2"/>
                    <line x1="0" y1="-28" x2="0" y2="28" stroke="#00f0ff" stroke-width="2"/>
                    <circle cx="0" cy="0" r="8" fill="#ffe600" stroke="#000" stroke-width="2"/>
                </g>

                <!-- ROLLERS TUNÉS -->
                <g transform="translate(310, 65) rotate(15)">
                    <path d="M 0 0 L 25 -30 L 50 -25 L 45 10 L -10 10 Z" fill="#7000ff" stroke="#000" stroke-width="3"/>
                    <rect x="-12" y="12" width="65" height="8" fill="#00f0ff" stroke="#000" stroke-width="2"/>
                    <circle cx="-5" cy="25" r="8" fill="#ffe600" stroke="#000" stroke-width="2"/>
                    <circle cx="20" cy="25" r="8" fill="#ffe600" stroke="#000" stroke-width="2"/>
                    <circle cx="45" cy="25" r="8" fill="#ffe600" stroke="#000" stroke-width="2"/>
                </g>

                <!-- EMOJI STICKERS SUR BÂTONS -->
                <g transform="translate(130, 45) rotate(-10)">
                    <line x1="0" y1="20" x2="0" y2="50" stroke="#ffe600" stroke-width="4"/>
                    <circle cx="0" cy="0" r="22" fill="#ff0055" stroke="#000" stroke-width="3"/>
                    <circle cx="-7" cy="-5" r="7" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <circle cx="-7" cy="-5" r="2" fill="#000"/>
                    <circle cx="8" cy="-5" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <circle cx="8" cy="-5" r="1.5" fill="#000"/>
                    <path d="M -12 8 Q 0 18 12 8" fill="none" stroke="#000" stroke-width="3"/>
                </g>

                <g transform="translate(200, 35) rotate(5)">
                    <line x1="0" y1="20" x2="0" y2="55" stroke="#00f0ff" stroke-width="4"/>
                    <circle cx="0" cy="0" r="25" fill="#ffe600" stroke="#000" stroke-width="3"/>
                    <ellipse cx="0" cy="-3" rx="18" ry="8" fill="#00f0ff" stroke="#000" stroke-width="2"/>
                    <path d="M -14 6 Q 0 22 14 6 Z" fill="#000"/>
                </g>

                <g transform="translate(265, 45) rotate(18)">
                    <line x1="0" y1="20" x2="0" y2="50" stroke="#ff0055" stroke-width="4"/>
                    <circle cx="0" cy="0" r="20" fill="#00ff66" stroke="#000" stroke-width="3"/>
                    <circle cx="-6" cy="-4" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
                    <circle cx="6" cy="-4" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
                    <path d="M -10 8 L 10 8" stroke="#000" stroke-width="3" stroke-dasharray="2,2"/>
                </g>

                <text x="200" y="145" font-size="70" font-weight="900" font-style="italic" fill="url(#neon-grad2)" stroke="#000" stroke-width="4" text-anchor="middle">FFF</text>
            </svg>
        </div>

        <h1 class="fff-title">FIGHT FOR FAST</h1>
        <p class="fff-slogan">Ride, Combats & Survis à la Zone !</p>
    </header>

    <!-- LAUNCHER PWA OVERLAY -->
    <div id="home-launcher">
        <div class="launcher-card">
            <h1 class="fff-title" style="font-size: 2.2rem;">Fight for Fast</h1>
            <p style="color: #a0a0b0; font-family: sans-serif; margin-bottom: 20px;">Parkour & Speed Battle Royale PWA</p>
            <button id="btn-play" class="btn-action">Lancer la Partie</button>
            <button id="btn-install-pwa" class="btn-action btn-pwa hidden">Installer l'App (PWA)</button>
        </div>
    </div>

    <!-- CANVAS VIEWPORT -->
    <div id="game-viewport">
        <canvas id="fff-canvas" width="900" height="420"></canvas>
    </div>

    <div class="controls-hint">
        Contrôles Warframe : [Q/D] Mouvement | [Espace] Saut / Bullet-Jump | [Shift] Glissade (Slide)
    </div>

    <!-- CONFIGURATION COFF -->
    <script type="text/coff" id="coff-core-config">
        <co name="physics_warframe">
            <stat name="gravity" val="0.5" />
            <stat name="walk_speed" val="5" />
            <stat name="slide_boost" val="12" />
            <stat name="bullet_jump_force_x" val="11" />
            <stat name="bullet_jump_force_y" val="-13" />
        </co>
    </script>

    <!-- MOTEUR JS & PHYSIQUE WARFRAME -->
    <script>
        const COFF_ENGINE = {
            config: {},
            init() {
                window.addEventListener('DOMContentLoaded', () => {
                    this.parseCOFF();
                    this.setupPWA();
                    this.bootGame();
                });
            },
            parseCOFF() {
                const rawCOFF = document.getElementById('coff-core-config').textContent;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(`<coff>${rawCOFF}</coff>`, "text/xml");
                const modules = xmlDoc.getElementsByTagName("co");
                Array.from(modules).forEach(mod => {
                    const modName = mod.getAttribute("name");
                    this.config[modName] = {};
                    Array.from(mod.children).forEach(child => {
                        const key = child.getAttribute("name");
                        const val = child.getAttribute("val");
                        this.config[modName][key] = isNaN(val) ? val : parseFloat(val);
                    });
                });
            },
            setupPWA() {
                let deferredPrompt;
                const launcher = document.getElementById('home-launcher');
                const playBtn = document.getElementById('btn-play');
                const installBtn = document.getElementById('btn-install-pwa');

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    installBtn.classList.remove('hidden');
                });

                installBtn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt = null;
                        installBtn.classList.add('hidden');
                    }
                });

                playBtn.addEventListener('click', () => {
                    launcher.classList.add('hidden');
                });
            },
            bootGame() {
                const canvas = document.getElementById("fff-canvas");
                const ctx = canvas.getContext("2d");
                const phys = this.config.physics_warframe;

                let player = {
                    x: 100, y: 300, radius: 18,
                    vx: 0, vy: 0,
                    isGrounded: false,
                    isSliding: false,
                    sautsRestants: 2
                };

                let keys = {};
                window.addEventListener('keydown', e => {
                    if (!keys[e.code] && e.code === 'Space') handleJump();
                    keys[e.code] = true;
                });
                window.addEventListener('keyup', e => { keys[e.code] = false; });

                function handleJump() {
                    if (player.isSliding) {
                        player.vx = (keys['KeyD'] || keys['ArrowRight']) ? phys.bullet_jump_force_x : -phys.bullet_jump_force_x;
                        if (player.vx === 0) player.vx = phys.bullet_jump_force_x;
                        player.vy = phys.bullet_jump_force_y;
                        player.isSliding = false;
                        player.isGrounded = false;
                        player.sautsRestants = 0;
                    } else if (player.sautsRestants > 0) {
                        player.vy = -10;
                        player.sautsRestants--;
                        player.isGrounded = false;
                    }
                }

                function update() {
                    if (keys['ShiftLeft'] || keys['ShiftRight']) {
                        if (!player.isSliding && player.isGrounded) {
                            player.isSliding = true;
                            const dir = (keys['KeyD'] || keys['ArrowRight']) ? 1 : ((keys['KeyA'] || keys['ArrowLeft']) ? -1 : 1);
                            player.vx = dir * phys.slide_boost;
                        }
                    } else {
                        player.isSliding = false;
                    }

                    if (!player.isSliding) {
                        if (keys['KeyD'] || keys['ArrowRight']) player.vx = phys.walk_speed;
                        else if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -phys.walk_speed;
                        else player.vx *= 0.8;
                    } else {
                        player.vx *= 0.96;
                    }

                    player.x += player.vx;
                    player.y += player.vy;
                    player.vy += phys.gravity;

                    const floorY = canvas.height - 40;
                    if (player.y + player.radius >= floorY) {
                        player.y = floorY - player.radius;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.sautsRestants = 2;
                    }

                    if (player.x - player.radius < 0) player.x = player.radius;
                    if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Sol Fortnite Neon
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(0, floorY, canvas.width, 40);
                    ctx.strokeStyle = "#00f0ff";
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();

                    // Rendu Joueur Fortnite Toon
                    ctx.save();
                    ctx.translate(player.x, player.y);
                    if (player.isSliding) ctx.scale(1.4, 0.6);

                    ctx.shadowColor = player.isSliding ? "#ff0055" : "#00f0ff";
                    ctx.shadowBlur = 15;

                    ctx.beginPath();
                    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                    ctx.fillStyle = player.isSliding ? "#ffe600" : "#00f0ff";
                    ctx.fill();
                    
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#000000";
                    ctx.stroke();
                    ctx.restore();

                    requestAnimationFrame(update);
                }

                update();
            }
        };

        COFF_ENGINE.init();
    </script>
</body>
</html>
