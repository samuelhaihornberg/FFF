<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFF - Cyber Launcher 3D Playground</title>
  
  <!-- Moteur 3D Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Segoe UI', sans-serif; user-select: none; }
    body { background-color: #050508; color: #fff; display: flex; height: 100vh; overflow: hidden; }

    /* Environment Viewer 3D */
    #viewport-3d { flex: 1; height: 100%; position: relative; background: radial-gradient(circle, #101424 0%, #050508 100%); }
    #canvas3d { width: 100%; height: 100%; display: block; }

    /* HUD, Logo & Branding */
    #hud-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
    #logo { height: 75px; filter: drop-shadow(0 0 12px #00e5ff); }
    .badge { background: rgba(255, 0, 85, 0.8); padding: 4px 12px; border-radius: 4px; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; width: fit-content; box-shadow: 0 0 10px #ff0055; }

    /* Launcher / Garage Panel */
    #launcher-panel { width: 360px; background: rgba(10, 12, 18, 0.95); border-left: 3px solid #ff0055; padding: 25px; display: flex; flex-direction: column; gap: 18px; box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 10; }
    h2 { color: #00e5ff; font-size: 1.5rem; text-transform: uppercase; font-style: italic; letter-spacing: 1px; text-shadow: 0 0 10px #00e5ff; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: #a0aab8; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; font-weight: bold; }
    select, input[type="text"], input[type="color"] { background: #121620; border: 1px solid #283245; color: #fff; padding: 10px; border-radius: 4px; outline: none; font-size: 0.91rem; }
    input[type="color"] { height: 42px; cursor: pointer; padding: 2px; }

    /* Controls Sound & Action */
    .audio-btn { background: #ff0055; border: none; color: #fff; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 1rem; box-shadow: 0 0 15px rgba(255,0,85,0.6); transition: 0.2s; }
    .audio-btn:hover { background: #ff2a75; transform: scale(1.02); }
    .audio-btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px #00e5ff; }

    .btn-launch { background: linear-gradient(90deg, #ff0055, #ffaa00); border: none; color: #fff; padding: 16px; border-radius: 4px; font-weight: bold; font-size: 1.3rem; cursor: pointer; margin-top: auto; text-transform: uppercase; font-style: italic; box-shadow: 0 0 20px rgba(255,0,85,0.6); }
    .btn-launch:hover { filter: brightness(1.2); transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- Data COFF isolée du DOM pour corriger l'affichage du texte brut -->
  <script type="text/coff" id="coff-data">
    <CoffSetup>
      <CharacterSetup>
        <Visual_Avatar>
          <Color_Stickman>#00ffff</Color_Stickman>
          <Head_Emoji>😎</Head_Emoji>
        </Visual_Avatar>
        <Vehicle>
          <Type>Velo</Type>
          <Color_Vehicle>#ff0055</Color_Vehicle>
        </Vehicle>
        <Class_Rules>
          <Class_Selected>Fighter</Class_Selected>
          <Color_Stuff>#ffaa00</Color_Stuff>
        </Class_Rules>
      </CharacterSetup>
    </CoffSetup>
  </script>

  <!-- Viewer 3D Playground -->
  <div id="viewport-3d">
    <div id="hud-overlay">
      <img id="logo" src="https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/images%20%26%20videos/1786846892107.png" alt="FFF Logo">
      <div class="badge">3D Engine Active</div>
    </div>
    <canvas id="canvas3d"></canvas>
  </div>

  <!-- Launcher / Home Page Sidebar -->
  <div id="launcher-panel">
    <h2>Garage & Custom 3D</h2>

    <button id="audio-toggle" class="audio-btn" onclick="toggleHardrockTechno()">⚡ Audio HardRockTechno</button>

    <div class="control-group">
      <label>Couleur Stickman</label>
      <input type="color" id="color-stickman" value="#00ffff">
    </div>

    <div class="control-group">
      <label>Tête (Emoji)</label>
      <input type="text" id="emoji-input" value="😎" maxlength="2">
    </div>

    <div class="control-group">
      <label>Véhicule</label>
      <select id="vehicle-select">
        <option value="Velo">Vélo Basic</option>
        <option value="Rollers">Rollers Basic</option>
        <option value="Skateboard">Skateboard Basic</option>
      </select>
    </div>

    <div class="control-group">
      <label>Couleur Véhicule</label>
      <input type="color" id="color-vehicle" value="#ff0055">
    </div>

    <div class="control-group">
      <label>Classe & Equipment</label>
      <select id="class-select">
        <option value="Fighter">Fighter (Gants/Chaussures)</option>
        <option value="Soldat">Soldat (Revolver)</option>
        <option value="Ingenieur">Ingénieur (Chaîne Élec)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Couleur Stuff</label>
      <input type="color" id="color-stuff" value="#ffaa00">
    </div>

    <button class="btn-launch" onclick="alert('Lancement du jeu Fight For Fast !')">START FIGHT</button>
  </div>

  <script>
    // Asset Registry (Permalinks Raw)
    const coffRegistry = {
      character: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Personnages/Model%20emojistick.glb',
      vehicles: {
        Rollers: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Vehicules/Rollers%20basic.glb',
        Velo: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Vehicules/Velo%20basic.glb',
        Skateboard: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Vehicules/Skateboard%20basic.glb'
      },
      stuff: {
        Fighter: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Stuff/gant%20choose.glb',
        Soldat: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Stuff/Revolver.glb',
        Ingenieur: 'https://raw.githubusercontent.com/samuelhaihornberg/FFF/06e0ec7a79ff4671124b73120212d48d1ac2ee7f/Stuff/Chaine%20electrique.glb'
      }
    };

    // Configuration du Rendu 3D
    let scene, camera, renderer, controls, loader;
    let currentCharacterMesh, currentVehicleMesh, currentStuffMesh;

    function init3D() {
      const container = document.getElementById('viewport-3d');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.8, 4);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.8, 0);

      // Éclairage Cyberpunk
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const light1 = new THREE.PointLight(0x00e5ff, 2, 10);
      light1.position.set(3, 3, 3);
      scene.add(light1);

      const light2 = new THREE.PointLight(0xff0055, 2, 10);
      light2.position.set(-3, 2, -3);
      scene.add(light2);

      // Sol Neon Grid
      const grid = new THREE.GridHelper(12, 24, 0xff0055, 0x00e5ff);
      scene.add(grid);

      loader = new THREE.GLTFLoader();

      // Chargement des objets GLB
      loadCharacter();
      loadVehicle('Velo');
      loadStuff('Fighter');

      animate();
    }

    function applyMeshColor(model, colorHex) {
      if (!model) return;
      model.traverse((child) => {
        if (child.isMesh && child.material) {
          child.material = child.material.clone();
          child.material.color.set(colorHex);
        }
      });
    }

    function loadCharacter() {
      loader.load(coffRegistry.character, (gltf) => {
        if (currentCharacterMesh) scene.remove(currentCharacterMesh);
        currentCharacterMesh = gltf.scene;
        currentCharacterMesh.position.set(0, 0.2, 0);
        applyMeshColor(currentCharacterMesh, document.getElementById('color-stickman').value);
        scene.add(currentCharacterMesh);
      });
    }

    function loadVehicle(type) {
      loader.load(coffRegistry.vehicles[type], (gltf) => {
        if (currentVehicleMesh) scene.remove(currentVehicleMesh);
        currentVehicleMesh = gltf.scene;
        applyMeshColor(currentVehicleMesh, document.getElementById('color-vehicle').value);
        scene.add(currentVehicleMesh);
      });
    }

    function loadStuff(classType) {
      loader.load(coffRegistry.stuff[classType], (gltf) => {
        if (currentStuffMesh) scene.remove(currentStuffMesh);
        currentStuffMesh = gltf.scene;
        currentStuffMesh.position.set(0, 0.8, 0);
        applyMeshColor(currentStuffMesh, document.getElementById('color-stuff').value);
        scene.add(currentStuffMesh);
      });
    }

    // Événements UI
    document.getElementById('color-stickman').addEventListener('input', (e) => applyMeshColor(currentCharacterMesh, e.target.value));
    document.getElementById('color-vehicle').addEventListener('input', (e) => applyMeshColor(currentVehicleMesh, e.target.value));
    document.getElementById('color-stuff').addEventListener('input', (e) => applyMeshColor(currentStuffMesh, e.target.value));
    document.getElementById('vehicle-select').addEventListener('change', (e) => loadVehicle(e.target.value));
    document.getElementById('class-select').addEventListener('change', (e) => loadStuff(e.target.value));

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (currentCharacterMesh) currentCharacterMesh.rotation.y += 0.005;
      renderer.render(scene, camera);
    }

    // Generator Sound Audio Synth: HardRockTechno
    let audioCtx, isPlaying = false, audioInterval;

    function toggleHardrockTechno() {
      const btn = document.getElementById('audio-toggle');
      if (!isPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isPlaying = true;
        btn.classList.add('active');
        btn.innerText = "🔥 Audio Playing (HardTechno)";
        
        let step = 0;
        audioInterval = setInterval(() => {
          // Kick Techno 135 BPM
          if (step % 4 === 0) playKick();
          // Rock Distortion Bass Synth
          if (step % 2 === 0) playRockDistortionBass(step % 8 === 0 ? 110 : 147);
          step++;
        }, 110);
      } else {
        clearInterval(audioInterval);
        audioCtx.close();
        isPlaying = false;
        btn.classList.remove('active');
        btn.innerText = "⚡ Audio HardRockTechno";
      }
    }

    function playKick() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playRockDistortionBass(freq) {
      const osc = audioCtx.createOscillator();
      const dist = audioCtx.createWaveShaper();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Courbe de distorsion Hard-Rock
      const curve = new Float32Array(44100);
      for (let i = 0; i < 44100; i++) {
        let x = (i * 2) / 44100 - 1;
        curve[i] = (3 + 20) * x * 20 * (Math.PI / 180) / (Math.PI + 20 * Math.abs(x));
      }
      dist.curve = curve;

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

      osc.connect(dist);
      dist.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    window.addEventListener('resize', () => {
      const container = document.getElementById('viewport-3d');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    window.onload = init3D;
  </script>
</body>
</html>
