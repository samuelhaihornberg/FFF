<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFF : Fast For Fight - Stickman 3.5D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: #87CEEB; color: #fff; font-family: 'Impact', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Launcher style */
        .launcher-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(8, 9, 13, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .launcher-card { background: #12131c; border: 3px solid #00f0ff; border-radius: 16px; padding: 25px; text-align: center; max-width: 400px; width: 90%; }
        .btn-start { background: linear-gradient(45deg, #ff0055, #ff5500); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-family: 'Impact'; font-size: 1.2rem; margin-top: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<div id="home-launcher" class="launcher-overlay">
    <div class="launcher-card">
        <h1 style="color:#00f0ff; font-style:italic;">FAST FOR FIGHT</h1>
        <div style="text-align: left; margin-top: 20px;">
            <label style="color:#00f0ff;">Classe : </label>
            <select id="sel-class" style="width:100%; padding:8px;">
                <option value="soldat">Soldat</option>
                <option value="fighter">Fighter</option>
            </select>
            <label style="color:#00f0ff; display:block; margin-top:10px;">Véhicule : </label>
            <select id="sel-vehicle" style="width:100%; padding:8px;">
                <option value="skate">Skateboard</option>
                <option value="rollers">Rollers</option>
            </select>
        </div>
        <button id="btn-start" class="btn-start">LANCER LA COURSE</button>
    </div>
</div>

<!-- CONFIGURATION COFF -->
<script type="text/coff" id="coff-core-config">
    <co name="physics_stickman">
        <stat name="gravity" val="0.8" />
        <stat name="move_speed" val="0.5" />
        <stat name="jump_force" val="1.5" />
    </co>
</script>

<script>
    // 1. Initialisation Moteur 3D
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    
    // 2. Parser COFF
    const coffData = {};
    const raw = document.getElementById('coff-core-config').textContent;
    const doc = new DOMParser().parseFromString(`<coff>${raw}</coff>`, "text/xml");
    Array.from(doc.getElementsByTagName("co")[0].children).forEach(s => {
        coffData[s.getAttribute("name")] = parseFloat(s.getAttribute("val"));
    });

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // 3. Modélisation Stickman 3.5D
    function buildStickman(className, vehicle) {
        playerGroup.clear();
        // Tête Emoji lisse
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshStandardMaterial({color: 0xffcc00}));
        head.position.y = 3.6;
        playerGroup.add(head);
        
        // Corps Stick (cylindre très fin)
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 8), new THREE.MeshStandardMaterial({color: 0xffffff}));
        body.position.y = 2.4;
        playerGroup.add(body);

        // Bras
        const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.0, 8);
        const armMat = new THREE.MeshStandardMaterial({color: 0xffffff});
        const armL = new THREE.Mesh(armGeo, armMat); armL.rotation.z = 0.5; armL.position.set(-0.4, 2.7, 0);
        const armR = new THREE.Mesh(armGeo, armMat); armR.rotation.z = -0.5; armR.position.set(0.4, 2.7, 0);
        playerGroup.add(armL, armR);

        // Véhicule
        const veh = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.2, 2.0), new THREE.MeshStandardMaterial({color: 0xff0055}));
        veh.position.y = 0.8;
        playerGroup.add(veh);
    }

    // 4. Lancement
    document.getElementById('btn-start').addEventListener('click', () => {
        buildStickman(document.getElementById('sel-class').value, document.getElementById('sel-vehicle').value);
        document.getElementById('home-launcher').classList.add('hidden');
    });

    function animate() {
        requestAnimationFrame(animate);
        camera.position.set(playerGroup.position.x, playerGroup.position.y + 3, playerGroup.position.z + 8);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);
        renderer.render(scene, camera);
    }
    buildStickman('soldat', 'skate');
    animate();
</script>
</body>
</html>
