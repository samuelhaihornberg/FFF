<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight for Fast (FFF)</title>
    <style id="coff-dynamic-css">
        /* Style de base pour l'arène */
        body.game-container {
            margin: 0;
            padding: 0;
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hud-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .hud-header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
            letter-spacing: 2px;
        }

        #game-viewport {
            position: relative;
            border: 3px solid #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #16161e;
        }
    </style>
</head>
<body class="game-container">

    <!-- HUD / En-tête -->
    <div class="hud-header">
        <h1>FIGHT FOR FAST</h1>
    </div>

    <!-- Zone de rendu du Jeu -->
    <div id="game-viewport">
        <canvas id="fff-canvas" width="900" height="450"></canvas>
    </div>

    <!-- BLOC COFF : Configuration & Méta-données -->
    <script type="text/coff" id="coff-core-config">
        <co name="game_rules">
            <rule name="title" val="Fight for Fast" />
            <rule name="shrink_interval" val="20" />
            <rule name="max_players" val="10" />
        </co>
        <co name="player_base">
            <stat name="hp" val="100" />
            <stat name="stamina" val="100" />
            <stat name="base_speed" val="4" />
        </co>
    </script>

    <!-- MOTEUR DE LIAISON COFF -> JS -->
    <script>
        const COFF_ENGINE = {
            config: {},
            
            // Initialisation sécurisée sans bugs de référence
            init() {
                window.addEventListener('DOMContentLoaded', () => {
                    this.parseCOFF();
                    console.log(" Moteur COFF initialisé avec succès :", this.config);
                    this.bootGame();
                });
            },

            // Interprétation des balises <co> de COFF
            parseCOFF() {
                const rawCOFF = document.getElementById('coff-core-config').textContent;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(`<coff>${rawCOFF}</coff>`, "text/xml");
                
                const modules = xmlDoc.getElementsByTagName("co");
                Array.from(modules).forEach(mod => {
                    const modName = mod.getAttribute("name");
                    this.config[modName] = {};
                    
                    Array.from(mod.children).forEach(child => {
                        const key = child.getAttribute("name");
                        const val = child.getAttribute("val");
                        this.config[modName][key] = isNaN(val) ? val : parseFloat(val);
                    });
                });
            },

            // Lancement du canevas
            bootGame() {
                const canvas = document.getElementById("fff-canvas");
                const ctx = canvas.getContext("2d");
                
                // Écran d'attente initial
                ctx.fillStyle = "#ff3366";
                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FFF Prêt. En attente de la suite...", canvas.width / 2, canvas.height / 2);
            }
        };

        // Démarrage
        COFF_ENGINE.init();
    </script>
</body>
</html>
