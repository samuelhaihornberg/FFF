<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FFF - Fast For Fight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background-color: #87CEEB; color: #fff; font-family: 'Impact', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px; z-index: 10;
        }

        .header-hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 2rem; color: #ff0055; text-transform: uppercase; font-style: italic; -webkit-text-stroke: 1px #fff; text-shadow: 2px 2px 0px #000; }
        
        .character-select {
            pointer-events: auto; background: rgba(255, 255, 255, 0.9); padding: 5px;
            border-radius: 10px; border: 2px solid #000; display: flex; gap: 5px;
        }
        .char-btn {
            background: #fff; border: 1px solid #000; padding: 4px 8px; font-weight: bold;
            cursor: pointer; border-radius: 6px; font-family: 'Impact', sans-serif; font-size: 0.85rem; text-transform: uppercase;
        }
        .char-btn.ninja { color: #ff0000; }
        .char-btn.soldier { color: #aa8800; }
        .char-btn.engineer { color: #0088ff; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* LAUNCHER */
        .launcher-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 9, 13, 0.95); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(8px); padding: 15px;
        }
        .launcher-card {
            background: #12131c; border: 3px solid #00f0ff; border-radius: 16px;
            padding: 20px; text-align: center; max-width: 450px; width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
        }
        .launcher-title {
            font-family: 'Impact', sans-serif; font-size: 2.2rem; color: #00f0ff;
            font-style: italic; text-transform: uppercase; text-shadow: 2px 2px #ff0055;
            margin-bottom: 5px;
        }
        .launcher-subtitle { color: #a0a0b0; font-size: 0.85rem; margin-bottom: 20px; font-family: 'Segoe UI', sans-serif; }

        .char-selector-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .char-option {
            background: #1a1c29; border: 2px solid #444; border-radius: 8px;
            padding: 10px 5px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 3px;
        }
        .char-option:hover { border-color: #00f0ff; }
        .char-option.active { border-color: #ff0055; background: rgba(255, 0, 85, 0.15); box-shadow: 0 0 12px rgba(255, 0, 85, 0.4); }
        .c-title { font-family: 'Impact', sans-serif; font-size: 1rem; color: #fff; text-transform: uppercase; }
        .c-veh { font-size: 0.7rem; color: #ffe600; font-family: 'Segoe UI', sans-serif; }

        .btn-launch-game {
            background: linear-gradient(45deg, #ff0055, #ff5500); color: white; border: none;
            padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; width: 100%; text-transform: uppercase; font-family: 'Impact', sans-serif;
            letter-spacing: 1px; transition: 0.2s; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        .btn-launch-game:hover { transform: scale(1.02); }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF : ORIGAMI</h1>
            <div class="character-select">
                <button class="char-btn ninja" onclick="switchCharacter('ninja')">Ninja</button>
                <button class="char-btn soldier" onclick="switchCharacter('soldier')">Soldat</button>
                <button class="char-btn engineer" onclick="switchCharacter('engineer')">Ingé</button>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="home-launcher" class="launcher-overlay">
        <div class="launcher-card">
            <h1 class="launcher-title">FAST FOR FIGHT</h1>
            <p class="launcher-subtitle">Choisis ton EmojiStick</p>
            
            <div class="char-selector-grid">
                <div class="char-option active" data-class="ninja" onclick="selectClass('ninja', this)">
                    <span class="c-title">Ninja</span>
                    <span class="c-veh">Rollers</span>
                </div>
                <div class="char-option" data-class="soldier" onclick="selectClass('soldier', this)">
                    <span class="c-title">Soldat</span>
                    <span class="c-veh">VTT</span>
                </div>
                <div class="char-option" data-class="engineer" onclick="selectClass('engineer', this)">
                    <span class="c-title">Ingénieur</span>
                    <span class="c-veh">Skate</span>
                </div>
            </div>

            <button id="btn-start-game" class="btn-launch-game">Lancer la Course</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Piste
        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 500),
            new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.9, flatShading: true })
        );
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const styles = {
            ninja: { head: 0xcc0000, body: 0x111111, veh: 0xff0055 },
            soldier: { head: 0xffcc00, body: 0x556b2f, veh: 0x00f0ff },
            engineer: { head: 0x0088ff, body: 0x002b80, veh: 0xffe600 }
        };

        function buildCharacter3D(className) {
            while(playerGroup.children.length > 0) {
                playerGroup.remove(playerGroup.children[0]);
            }
            const t = styles[className] || styles.ninja;

            // Tête
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.8, 16, 16),
                new THREE.MeshStandardMaterial({ color: t.head, roughness: 0.2, flatShading: true })
            );
            head.position.y = 3.0;
            playerGroup.add(head);

            // Corps Stick
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 1.6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            body.position.y = 1.8;
            playerGroup.add(body);

            // Véhicule simple
            const veh = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.2, 2.5),
                new THREE.MeshStandardMaterial({ color: t.veh, flatShading: true })
            );
            veh.position.y = 0.3;
            playerGroup.add(veh);
        }

        let selectedClass = 'ninja';
        function selectClass(c, el) {
            selectedClass = c;
            document.querySelectorAll('.char-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            buildCharacter3D(selectedClass);
        }

        function switchCharacter(c) {
            buildCharacter3D(c);
        }

        document.getElementById('btn-start-game').addEventListener('click', () => {
            buildCharacter3D(selectedClass);
            document.getElementById('home-launcher').classList.add('hidden');
        });

        buildCharacter3D('ninja');

        function animate() {
            requestAnimationFrame(animate);
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 3.5, playerGroup.position.z + 7);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
