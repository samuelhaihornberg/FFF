<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FFF - Fast For Fight : Launcher & 3D Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background-color: #87CEEB; color: #fff; font-family: 'Impact', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px; z-index: 10;
        }

        .header-hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 2rem; color: #ff0055; text-transform: uppercase; font-style: italic; -webkit-text-stroke: 1px #fff; text-shadow: 2px 2px 0px #000; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* LAUNCHER & STUDIO DE CRÉATION */
        .launcher-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 9, 13, 0.96); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(10px); padding: 15px;
            overflow-y: auto;
        }
        .launcher-card {
            background: #12131c; border: 3px solid #00f0ff; border-radius: 16px;
            padding: 20px; text-align: center; max-width: 500px; width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
        }
        .launcher-title {
            font-family: 'Impact', sans-serif; font-size: 2.2rem; color: #00f0ff;
            font-style: italic; text-transform: uppercase; text-shadow: 2px 2px #ff0055;
            margin-bottom: 5px;
        }
        .launcher-subtitle { color: #a0a0b0; font-size: 0.85rem; margin-bottom: 15px; font-family: 'Segoe UI', sans-serif; }

        .customizer-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; text-align: left;
            font-family: 'Segoe UI', sans-serif; font-size: 0.85rem;
        }
        .customizer-group { display: flex; flex-direction: column; gap: 4px; }
        .customizer-group label { color: #00f0ff; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; }
        .customizer-group select, .customizer-group input {
            background: #1a1c29; color: #fff; border: 1px solid #ff0055; padding: 8px; border-radius: 6px; font-weight: bold;
        }

        .btn-launch-game {
            background: linear-gradient(45deg, #ff0055, #ff5500); color: white; border: none;
            padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; width: 100%; text-transform: uppercase; font-family: 'Impact', sans-serif;
            letter-spacing: 1px; transition: 0.2s; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); margin-top: 10px;
        }
        .btn-launch-game:hover { transform: scale(1.02); }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-hud">
            <h1 class="logo">FFF : ORIGAMI</h1>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- LAUNCHER & STUDIO DE PERSONNALISATION COMPLET -->
    <div id="home-launcher" class="launcher-overlay">
        <div class="launcher-card">
            <h1 class="launcher-title">STUDIO EMOJISTICK</h1>
            <p class="launcher-subtitle">Configure ton profil, ton look et ton bolide</p>
            
            <div class="customizer-grid">
                <div class="customizer-group">
                    <label>Classe Opérationnelle</label>
                    <select id="sel-class">
                        <option value="soldat">Soldat</option>
                        <option value="fighter">Fighter</option>
                        <option value="medecin">Médecin</option>
                        <option value="ingenieur">Ingénieur</option>
                    </select>
                </div>
                <div class="customizer-group">
                    <label>Véhicule 3D</label>
                    <select id="sel-vehicle">
                        <option value="skate">Skateboard</option>
                        <option value="vtt">VTT Cross</option>
                        <option value="rollers">Rollers</option>
                    </select>
                </div>
                <div class="customizer-group">
                    <label>Émotion (Visage)</label>
                    <select id="sel-emotion">
                        <option value="sourire">Confiant</option>
                        <option value="furieux">Furieux</option>
                        <option value="cool">Lunettes Cool</option>
                    </select>
                </div>
                <div class="customizer-group">
                    <label>Couleur du Skin</label>
                    <input type="color" id="sel-color" value="#ffcc00">
                </div>
            </div>

            <button id="btn-start-game" class="btn-launch-game">Entrer dans la Piste</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Piste
        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 500),
            new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.9, flatShading: true })
        );
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // --- GÉNÉRATEUR 3D DU PERSONNAGE SELON LES PARAMÈTRES DU LAUNCHER ---
        function buildCustomCharacter(config) {
            while(playerGroup.children.length > 0) {
                playerGroup.remove(playerGroup.children[0]);
            }

            // 1. Tête Emoji
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.9, 16, 16),
                new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.2, flatShading: true })
            );
            head.position.y = 3.0;
            playerGroup.add(head);

            // 2. Accessoires d'émotion / Visage
            if (config.emotion === 'cool') {
                const glasses = new THREE.Mesh(
                    new THREE.BoxGeometry(1.0, 0.3, 0.4),
                    new THREE.MeshBasicMaterial({ color: 0x000000 })
                );
                glasses.position.set(0, 3.0, 0.7);
                playerGroup.add(glasses);
            }

            // 3. Corps Stickman et Accessoires de Classe
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 1.6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            body.position.y = 1.8;
            playerGroup.add(body);

            if (config.combatClass === 'ingenieur') {
                const tool = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                tool.position.set(0.5, 1.8, 0);
                playerGroup.add(tool);
            }

            // 4. Véhicule 3D Origami
            let vehGeo;
            if (config.vehicle === 'skate') {
                vehGeo = new THREE.BoxGeometry(1.2, 0.2, 3.0);
            } else if (config.vehicle === 'vtt') {
                vehGeo = new THREE.BoxGeometry(0.3, 0.8, 2.5);
            } else {
                vehGeo = new THREE.BoxGeometry(0.5, 0.4, 1.2);
            }

            const vehicle = new THREE.Mesh(
                vehGeo,
                new THREE.MeshStandardMaterial({ color: 0x00f0ff, flatShading: true })
            );
            vehicle.position.y = 0.3;
            playerGroup.add(vehicle);
        }

        // --- VALIDATION DU LAUNCHER ---
        document.getElementById('btn-start-game').addEventListener('click', () => {
            const playerConfig = {
                combatClass: document.getElementById('sel-class').value,
                vehicle: document.getElementById('sel-vehicle').value,
                emotion: document.getElementById('sel-emotion').value,
                color: document.getElementById('sel-color').value
            };

            buildCustomCharacter(playerConfig);
            document.getElementById('home-launcher').classList.add('hidden');
        });

        // Aperçu par défaut au chargement
        buildCustomCharacter({ combatClass: 'soldat', vehicle: 'skate', emotion: 'sourire', color: '#ffcc00' });

        function animate() {
            requestAnimationFrame(animate);
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 3.5, playerGroup.position.z + 7);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
